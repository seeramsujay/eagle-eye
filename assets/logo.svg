<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E18" />
      <stop offset="50%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#04070D" />
    </linearGradient>

    <!-- Aerodynamic Gold to Cyan Gradient -->
    <linearGradient id="wing-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Radar Targeting Crimson Gradient -->
    <linearGradient id="target-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <filter id="uav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="792" height="792" x="4" y="4" rx="156" fill="none" stroke="#1E293B" stroke-width="3" />

  <!-- High-Altitude Optical Targeting Reticle Rings -->
  <circle cx="400" cy="380" r="250" fill="none" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="10 12" />
  <circle cx="400" cy="380" r="180" fill="url(#radar-glow)" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="400" cy="380" r="100" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />

  <!-- UAV Flight Compass Crosshairs -->
  <line x1="120" y1="380" x2="680" y2="380" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" />
  <line x1="400" y1="120" x2="400" y2="640" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" />

  <!-- Swept Flying Wing Aerodynamic Geometry (920mm Wing Contour) -->
  <path d="M 400,200 
           L 440,280 
           L 660,390 
           L 630,420 
           L 460,370 
           L 440,430 
           L 400,410 
           L 360,430 
           L 340,370 
           L 170,420 
           L 140,390 
           L 360,280 Z" 
        fill="#0F172A" stroke="url(#wing-grad)" stroke-width="5" stroke-linejoin="round" filter="url(#uav-glow)" />

  <!-- Elevon Control Surfaces -->
  <polygon points="180,410 330,370 335,385 185,420" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
  <polygon points="620,410 470,370 465,385 615,420" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />

  <!-- Center Wing Core / Avionics Bay -->
  <polygon points="400,225 425,300 400,370 375,300" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />

  <!-- Pusher Propeller Disc Spin Ring -->
  <ellipse cx="400" cy="425" rx="36" ry="10" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Eagle Eye Target Acquisition Diamond (Ground Target Lock) -->
  <polygon points="400,320 440,350 400,380 360,350" fill="none" stroke="url(#target-grad)" stroke-width="3" filter="url(#uav-glow)" />
  <circle cx="400" cy="350" r="6" fill="#EF4444" filter="url(#uav-glow)" />

  <!-- Target Tracking HUD Corner Bounding Brackets -->
  <path d="M 330,300 L 310,300 L 310,320" stroke="#EF4444" stroke-width="3" fill="none" />
  <path d="M 470,300 L 490,300 L 490,320" stroke="#EF4444" stroke-width="3" fill="none" />
  <path d="M 330,400 L 310,400 L 310,380" stroke="#EF4444" stroke-width="3" fill="none" />
  <path d="M 470,400 L 490,400 L 490,380" stroke="#EF4444" stroke-width="3" fill="none" />
  <text x="495" y="325" font-family="monospace" font-weight="900" font-size="12" fill="#EF4444">LOCK [38 km/h]</text>

  <!-- LoRa 433MHz Telemetry Radio Arcs -->
  <path d="M 370,170 A 40,40 0 0 1 430,170" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <path d="M 350,150 A 70,70 0 0 1 450,150" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 330,130 A 100,100 0 0 1 470,130" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Typography Brand Mark -->
  <text x="400" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#F8FAFC" text-anchor="middle" letter-spacing="8">PROJECT EAGLE-EYE</text>
  <text x="400" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#F59E0B" text-anchor="middle" letter-spacing="4">AUTONOMOUS CAR-TRACKING FLYING WING UAV</text>
</svg>
