; PlatformIO Project Configuration File for Project Eagle-Eye Airborne Flight Controller
; MCU: ESP32-WROOM-32 (38-pin DevKit)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -Iinclude
    -I../common
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=0

lib_deps = 
    sandeepmistry/LoRa @ ^0.8.0
